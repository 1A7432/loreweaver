# Dependabot version updates — deliberately LOW-NOISE for a solo maintainer:
# monthly cadence, everything grouped into one PR per ecosystem. Security
# updates are separate (enabled repo-wide) and arrive as soon as a CVE lands.
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      python-deps:
        patterns: ["*"]
  - package-ecosystem: "bun"
    directory: "/clients"
    schedule:
      interval: "monthly"
    groups:
      client-deps:
        patterns: ["*"]
    # OpenTUI is 0.x and breaks its rendering API between minors (0.4 -> 0.9 moved
    # SyntaxStyle ownership and the test frame capture). Upgrading it is a migration
    # with a visual check, done on purpose — not something a grouped PR can carry.
    ignore:
      - dependency-name: "@opentui/*"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    groups:
      actions:
        patterns: ["*"]
