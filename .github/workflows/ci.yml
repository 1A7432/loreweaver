name: CI

on:
  push:
    # v3: the 3.0 rewrite lives on its own long-running branch until it is released.
    branches: [main, v3]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  clients:
    name: Clients — TypeScript (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: protocol (shared)
        working-directory: clients/protocol
        # `bun run test`, not `bun test`: the package script is `tsc --noEmit` AND the
        # runner, and the type gate is the half that catches a protocol type drifting.
        run: bun install && bun run test
      - name: tui (OpenTUI)
        working-directory: clients/tui
        # `check` is `tsc --noEmit` AND the runner, as for the protocol above.
        run: bun install && bun run check && bun run build

  server:
    name: Server + module SDK — TypeScript (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # One workspace for the whole repository (the root package.json); `--frozen-lockfile`
      # fails the job when bun.lock does not match the manifests.
      - run: bun install --frozen-lockfile
      # `check` is `tsc --noEmit` AND the test runner, for the same reason as the
      # protocol job above: the type gate is half of the gate.
      - name: sdk
        working-directory: sdk
        run: bun run check
      - name: server
        working-directory: server
        run: bun run check

  server-binary:
    # The compiled server on every platform it is released for. The self-test brings up
    # the parts a single-file build can lose: the room worker thread, loading a module's
    # TypeScript from disk, the native iroh transport and the database.
    name: Server binary — build + self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: build
        working-directory: server
        # The two entry points and their order are what `roomWorkerEntry` relies on.
        run: bun build --compile src/cli/main.ts src/worker/main.ts --outfile dist/loreweaver
      - name: self-test
        working-directory: server
        run: ./dist/loreweaver${{ runner.os == 'Windows' && '.exe' || '' }} selftest
