name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.python-version }}) — lint + i18n + tests
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with `requires-python` in pyproject.toml (currently >=3.11).
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.0.1
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      # anthropic/gemini: the two native (non-OpenAI-shaped) provider classes,
      # whose contract tests are version-sensitive. ejs: the QuickJS sandbox every
      # untrusted-code lane runs in — the rules-script resolvers, the Layer C.1
      # skill hooks and the full-EJS templates all SKIP THEMSELVES without it, so
      # leaving it out silently retires the coverage that matters most here. Keep
      # this in sync with the `uv sync` line in AGENTS.md. The `dev`
      # dependency-group (pytest/ruff) is installed by default; --locked asserts
      # uv.lock is current.
      - run: uv sync --locked --extra anthropic --extra gemini --extra ejs
      - name: Ruff
        run: uv run ruff check core infra agent gateway net adapters app.py lw_versioning.py scripts
      - name: i18n lint (no hardcoded natural-language strings)
        run: uv run python scripts/i18n_lint.py
      - name: Tests (offline — FakeLLM/FakeEmbeddings, no API keys)
        run: uv run pytest -q

  clients:
    name: Clients — TypeScript (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: protocol (shared)
        working-directory: clients/protocol
        # `bun run test`, not `bun test`: the package script is `tsc --noEmit` AND the
        # runner, and the type gate is the half that catches a protocol type drifting.
        run: bun install && bun run test
      - name: tui (OpenTUI)
        working-directory: clients/tui
        run: bun install && bun test && bun run build
