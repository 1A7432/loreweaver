name: CI

on:
  push:
    # v3: the 3.0 rewrite lives on its own long-running branch until it is released.
    branches: [main, v3]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  frozen:
    # The Python server is frozen on this branch: it is the reference the rewrite reads,
    # and it is deleted when 3.0 ships. Its own tests no longer run here (they can only
    # change if its files do); instead this job fails when the branch differs from main
    # anywhere in the frozen tree.
    name: Frozen Python tree untouched
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: No frozen path differs from main
        run: |
          git fetch --no-tags origin main
          base=$(git merge-base origin/main HEAD)
          changed=$(git diff --name-only "$base" HEAD -- \
            core infra agent gateway net adapters tests \
            app.py lw_versioning.py conftest.py pyproject.toml uv.lock loreweaver-server.spec \
            scripts/i18n_lint.py scripts/i18n_allowlist.txt scripts/package_server.py \
            scripts/playtest.py scripts/longrun.py scripts/coverage_sweep.py)
          if [ -n "$changed" ]; then
            echo "These frozen files differ from main:"
            echo "$changed"
            exit 1
          fi
          echo "The frozen tree is identical to main."

  clients:
    name: Clients — TypeScript (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - name: protocol (shared)
        working-directory: clients/protocol
        # `bun run test`, not `bun test`: the package script is `tsc --noEmit` AND the
        # runner, and the type gate is the half that catches a protocol type drifting.
        run: bun install && bun run test
      - name: tui (OpenTUI)
        working-directory: clients/tui
        run: bun install && bun test && bun run build

  server:
    name: Server + module SDK — TypeScript (bun)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      # One workspace for the whole repository (the root package.json); `--frozen-lockfile`
      # fails the job when bun.lock does not match the manifests.
      - run: bun install --frozen-lockfile
      # `check` is `tsc --noEmit` AND the test runner, for the same reason as the
      # protocol job above: the type gate is half of the gate.
      - name: sdk
        working-directory: sdk
        run: bun run check
      - name: server
        working-directory: server
        run: bun run check

  server-binary:
    # The compiled server on every platform it is released for. The self-test brings up
    # the parts a single-file build can lose: the room worker thread, loading a module's
    # TypeScript from disk, the native iroh transport and the database.
    name: Server binary — build + self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, windows-latest]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - name: build
        working-directory: server
        # The two entry points and their order are what `roomWorkerEntry` relies on.
        run: bun build --compile src/cli/main.ts src/worker/main.ts --outfile dist/loreweaver
      - name: self-test
        working-directory: server
        run: ./dist/loreweaver${{ runner.os == 'Windows' && '.exe' || '' }} selftest
