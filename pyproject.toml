[project]
name = "loreweaver"
dynamic = ["version"]
description = "A self-hosted, terminal-first AI Game Master / Keeper for any TTRPG system — dice bot + function-calling AI KP, system-agnostic (D&D 5e SRD + CoC7)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "loreweaver contributors" }]
keywords = ["ttrpg", "dnd", "coc", "dice", "ai", "game-master", "keeper"]

dependencies = [
    "d20>=1.1.2",
    "openai>=2.50.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyyaml>=6.0",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "aiohttp>=3.14.3",
    "numpy>=1.24",
    "websockets>=16.1.1",  # net/tui_server WebSocket server + clients (15.x proxy handling breaks localhost)
    "iroh>=1.1.0",  # net/iroh_server p2p QUIC transport — the DEFAULT carrier (dial a ticket, not a domain)
]

[project.urls]
Homepage = "https://1a7432.site"
Repository = "https://github.com/1A7432/loreweaver"
Documentation = "https://1a7432.site/commands-en.html"
Issues = "https://github.com/1A7432/loreweaver/issues"

[project.optional-dependencies]
vector = ["sqlite-vec>=0.1.1"]
# Full SillyTavern EJS template compatibility: real JavaScript in worldbook/card content,
# executed in an embedded QuickJS sandbox (memory/time-capped, no host I/O). Without this
# extra the engine falls back to the safe built-in subset (core/ejs_lite.py).
ejs = ["quickjs>=1.19.4"]
anthropic = ["anthropic>=0.120.2"]
gemini = ["google-genai>=2.14.0"]
# PyInstaller onedir packaging (`scripts/package_server.py`) — a self-contained
# per-platform server bundle; not needed to develop/run/test loreweaver itself.
package = ["pyinstaller>=6.11"]

[dependency-groups]
# Dev tooling as a uv-native group (PEP 735): `uv sync` installs it by default.
# pip users (fallback): `pip install -e . && pip install pytest pytest-asyncio ruff`,
# or with pip >= 25.1: `pip install --group dev`.
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.16.0"]

[project.scripts]
loreweaver = "app:main"

[build-system]
requires = ["setuptools>=83.0.0", "setuptools-scm>=10.2.1"]
# `__legacy__` differs from plain `build_meta` in exactly one way: it puts the source
# tree on `sys.path` for the backend. That is what lets setuptools_scm import the
# `lw_versioning` module named below; with plain `build_meta` the import fails, the
# scheme silently falls through to the default guess, and the version quietly stops
# following the protocol. Verified by `test_built_version_follows_the_protocol`.
build-backend = "setuptools.build_meta:__legacy__"

[tool.setuptools_scm]
# Auto, git-derived versioning: the version increases with every commit; milestone
# versions come from `v*` tags. Automated GitHub Releases use `release-*` tags that are
# NOT source-version tags — `--match` on the describe command excludes them so they can
# never poison the derivation.
git_describe_command = "git describe --dirty --tags --long --match v[0-9]*"
# The package version FOLLOWS THE WIRE PROTOCOL version (owner rule 2026-08-07): a
# development build is `<protocol>.dev<N>+g<sha>`, so bumping `_PROTOCOL_VERSION` in
# `net/session.py` moves the package on its own and the two can never drift again.
# `lw_versioning` explains the monotonicity rule and returns None when it cannot read
# the constant, which falls through to the default guess below. The list form is how
# `vcs_versioning` chains schemes; the object reference is resolved by importlib, so the
# module must stay a top-level file next to `pyproject.toml`.
version_scheme = ["lw_versioning:protocol_dev_version", "guess-next-dev"]
# The one-click host's source-tarball install tier has no `.git` dir at all (a plain
# GitHub tarball checkout) — `uv sync`/`pip install` there must not explode.
fallback_version = "0.0.0+unknown"
# A plain top-level module (this is a flat-package repo, no single src/pkg tree) so
# runtime code can read the resolved version without importlib gymnastics. Generated
# at build time — gitignored, never hand-edited or committed.
version_file = "_lw_version.py"

[tool.setuptools]
# `net` is a real package. `app.py` is a top-level module (the `loreweaver`
# console script's entry point, and `python -m app --cli`'s target).
# `rulepacks`/`locales` are data-only "packages" (no __init__.py — PEP 420
# implicit namespace packages) so their files land as siblings of core/infra/
# etc. directly under site-packages, matching the runtime lookup in
# core/rulepacks.py and infra/i18n.py: both resolve their data dir as
# `Path(__file__).resolve().parent.parent / "<rulepacks|locales>"`, i.e. two
# levels up from the loader module — which is site-packages root in an
# installed (non-editable) wheel, not the source repo root.
#
# Also folds in a second, same-shape pre-existing omission found while
# hard-verifying this fix: `adapters` has a real subpackage (adapters.cli)
# that the old flat `["core", ..., "adapters"]` list never declared, so it was
# silently absent from the wheel too — `python -m app --cli` imports
# `adapters.cli.adapter` and would ModuleNotFoundError on a clean install.
packages = [
    "core",
    "infra",
    "agent",
    "gateway",
    "adapters",
    "adapters.cli",
    "net",
    "rulepacks",
    "locales",
    "locales.en",
    "locales.zh",
    "assets",
    "assets.vendor",
]
py-modules = ["app", "_lw_version"]

[tool.setuptools.package-data]
rulepacks = ["*.yaml"]
"locales.en" = ["*.json"]
"locales.zh" = ["*.json"]
# core/ejs_full.py loads the vendored EJS + lodash sources at engine start.
"assets.vendor" = ["*.js", "*LICENSE*"]
# adapters/cli/demo.py loads this offline-demo module text via a
# `Path(__file__).with_name(...)` sibling-file read at import time; without
# declaring it, setuptools ships only `*.py` for a package and the import
# crashes with FileNotFoundError on a clean install.
"adapters.cli" = ["*.txt"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "F401"]
"adapters/*/vendor_*.py" = ["ALL"]
