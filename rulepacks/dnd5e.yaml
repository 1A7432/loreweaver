    CHA: {min: 3, max: 18, roll: "4d6kh3"}
  methods:
    point_buy:
      budget: 27
      min: 8
      max: 15
      costs: {8: 0, 9: 1, 10: 2, 11: 3, 12: 4, 13: 5, 14: 7, 15: 9}
    standard_array:
      values: [15, 14, 13, 12, 10, 8]
    rolled:
      formula: "4d6kh3"
      min: 3
      max: 18
  # Concept-driven placement priority for standard-array creation: which
  # attribute (storage key) gets the best value per archetype keyword. Pure
  # game DATA consumed by the generic persona->sheet builder.
  archetype_priorities:
    barbarian: [STR, CON, DEX, WIS, CHA, INT]
    bard: [CHA, DEX, CON, WIS, INT, STR]
    cleric: [WIS, CON, STR, CHA, INT, DEX]
    druid: [WIS, CON, DEX, INT, CHA, STR]
    fighter: [STR, CON, DEX, WIS, INT, CHA]
    monk: [DEX, WIS, CON, STR, INT, CHA]
    paladin: [STR, CHA, CON, WIS, DEX, INT]
    ranger: [DEX, WIS, CON, STR, INT, CHA]
    rogue: [DEX, INT, CON, CHA, WIS, STR]
    sorcerer: [CHA, CON, DEX, WIS, INT, STR]
    warlock: [CHA, CON, DEX, WIS, INT, STR]
    wizard: [INT, CON, DEX, WIS, CHA, STR]
