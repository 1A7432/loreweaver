# Check resolution (M16): the d100 roll-under ladder, compiled by core.resolution.
# The ENGINE rolls (`roll:`, with the named tens-dice modifiers) and the ladder
# below INTERPRETS — a pure (roll, target) -> rank grading the engine can replay,
# re-grade after a Luck spend, and exhaustively table-test. Expression namespace:
# roll (final d100), target (difficulty-adjusted), raw_target (before difficulty),
# dice[i], plus floor/ceil/min/max/abs. First matching rule wins; every ladder
# ends with an unconditional fallback. `variants:` are the SealDice `.setcoc`
# house rules — whole replacement ladders, selected per room at interpret time.
resolution:
  version: 1
  roll: 1d100
  target: skill
  compare: "<="
  modifiers:
    bonus: {tens_reroll: keep_lowest}
    penalty: {tens_reroll: keep_highest}
  # How the generic check tool/commands feed this system: the favorable /
  # unfavorable counts route to these named roll modifiers.
  check:
    favorable: bonus
    unfavorable: penalty
    default_skill: 侦查
  difficulties:
    regular: {prefixes: {en: [regular], zh: []}}
    hard: {target: "floor(target / 2)", prefixes: {en: [hard], zh: [困难]}}
    extreme: {target: "floor(target / 5)", prefixes: {en: [extreme], zh: [极难]}}
    critical: {target: "1", prefixes: {en: [critical], zh: [大成功]}}
  # Rulebook rule (SealDice rule 0): 1 always crits; 100 always fumbles; the
  # 96-100 fumble band applies when the EFFECTIVE target is below 50.
  ranks:
    - {id: crit, when: "roll == 1", success: true, critical: true, tier: 5}
    - {id: fumble, when: "roll == 100", fumble: true, tier: 0}
    - {id: extreme, when: "roll <= target && roll <= floor(raw_target / 5)", success: true, tier: 4}
    - {id: hard, when: "roll <= target && roll <= floor(raw_target / 2)", success: true, tier: 3}
    - {id: regular, when: "roll <= target", success: true, tier: 2}
    - {id: fumble, when: "roll >= 96 && target < 50", fumble: true, tier: 0}
    - {id: fail, tier: 1}
  variants:
    # rule 1: crit 1-5 at skill>=50 (else 1); fumble 96-100 below 50 (else 100).
    rule1:
      ranks:
        - {id: crit, when: "roll == 1", success: true, critical: true, tier: 5}
        - {id: crit, when: "raw_target >= 50 && roll <= 5", success: true, critical: true, tier: 5}
        - {id: extreme, when: "roll <= target && roll <= floor(raw_target / 5)", success: true, tier: 4}
        - {id: hard, when: "roll <= target && roll <= floor(raw_target / 2)", success: true, tier: 3}
        - {id: regular, when: "roll <= target", success: true, tier: 2}
        - {id: fumble, when: "raw_target < 50 && roll >= 96", fumble: true, tier: 0}
        - {id: fumble, when: "raw_target >= 50 && roll == 100", fumble: true, tier: 0}
        - {id: fail, tier: 1}
    # rule 2 (domestic common): crit = 1-5 capped by the skill; fumble 96-100
    # (a 96+ skill only fumbles above its own value).
    rule2:
      ranks:
        - {id: crit, when: "roll == 1", success: true, critical: true, tier: 5}
        - {id: crit, when: "roll <= 5 && roll <= raw_target", success: true, critical: true, tier: 5}
        - {id: extreme, when: "roll <= target && roll <= floor(raw_target / 5)", success: true, tier: 4}
        - {id: hard, when: "roll <= target && roll <= floor(raw_target / 2)", success: true, tier: 3}
        - {id: regular, when: "roll <= target", success: true, tier: 2}
        - {id: fumble, when: "raw_target < 96 && roll >= 96", fumble: true, tier: 0}
        - {id: fumble, when: "raw_target >= 96 && roll >= min(raw_target + 1, 100)", fumble: true, tier: 0}
        - {id: fail, tier: 1}
    # rule 3 (strict): 1-5 crit and 96-100 fumble OVERRIDE the check result.
    rule3:
      ranks:
        - {id: fumble, when: "roll >= 96", fumble: true, tier: 0}
        - {id: crit, when: "roll <= 5", success: true, critical: true, tier: 5}
        - {id: extreme, when: "roll <= target && roll <= floor(raw_target / 5)", success: true, tier: 4}
        - {id: hard, when: "roll <= target && roll <= floor(raw_target / 2)", success: true, tier: 3}
        - {id: regular, when: "roll <= target", success: true, tier: 2}
        - {id: fail, tier: 1}
    # rule 4 (balanced): crit 1..min(skill/10, 5); fumble from 96 + skill/10.
    rule4:
      ranks:
        - {id: crit, when: "roll <= min(floor(raw_target / 10), 5)", success: true, critical: true, tier: 5}
        - {id: extreme, when: "roll <= target && roll <= floor(raw_target / 5)", success: true, tier: 4}
        - {id: hard, when: "roll <= target && roll <= floor(raw_target / 2)", success: true, tier: 3}
        - {id: regular, when: "roll <= target", success: true, tier: 2}
        - {id: fumble, when: "roll >= min(96 + floor(raw_target / 10), 100)", fumble: true, tier: 0}
        - {id: fail, tier: 1}
    # rule 5 (hard): crit 1..min(skill/5, 2); fumble 96-100 below 50, else 99-100.
    rule5:
      ranks:
        - {id: crit, when: "roll <= min(floor(raw_target / 5), 2)", success: true, critical: true, tier: 5}
        - {id: extreme, when: "roll <= target && roll <= floor(raw_target / 5)", success: true, tier: 4}
        - {id: hard, when: "roll <= target && roll <= floor(raw_target / 2)", success: true, tier: 3}
        - {id: regular, when: "roll <= target", success: true, tier: 2}
        - {id: fumble, when: "raw_target < 50 && roll >= 96", fumble: true, tier: 0}
        - {id: fumble, when: "raw_target >= 50 && roll >= 99", fumble: true, tier: 0}
        - {id: fail, tier: 1}
    # dg (Delta Green): matching digits decide — doubles crit on a success and
    # fumble on a failure; no hard/extreme tiers; 1 always crits.
    dg:
      ranks:
        - {id: crit, when: "roll == 1", success: true, critical: true, tier: 5}
        - {id: crit, when: "roll <= target && roll % 10 == floor(roll / 10) % 10", success: true, critical: true, tier: 5}
        - {id: fumble, when: "roll > target && roll % 10 == floor(roll / 10) % 10", fumble: true, tier: 0}
        - {id: regular, when: "roll <= target", success: true, tier: 2}
        - {id: fail, tier: 1}
# Success-ladder presentation labels (rank id -> display + detector markers).
# `display` renders in tool output and wire frames; `markers` join the agent's
# dice-first outcome detectors (core.rulepacks.all_outcome_labels). Generic
# words ("Success"/"成功") stay display-only so ordinary narration never
# false-positives as an already-graded check.
labels:
  en:
    crit: [Critical Success]
    extreme: [Extreme Success]
    hard: [Hard Success]
    regular: {display: Success, markers: [Regular Success]}
    fail: {display: Failure, markers: []}
    fumble: [Fumble, Critical Failure]
  zh:
    crit: [大成功]
    extreme: [极难成功]
    hard: [困难成功]
    regular: {display: 成功, markers: [常规成功, 普通成功]}
    fail: {display: 失败, markers: []}
    fumble: [大失败]
derived:
  DB:
    sum_ranges:
      of: [力量, 体型]
      ranges: [[0, 64, "-2"], [65, 84, "-1"], [85, 124, "0"], [125, 164, 1d4], [165, 204, 1d6]]
      else: {expr: "floor((力量 + 体型 - 205) / 80) + 2", format: "{}d6"}
  体格:
    sum_ranges:
      of: [力量, 体型]
      ranges: [[0, 64, -2], [65, 84, -1], [85, 124, 0], [125, 164, 1], [165, 204, 2]]
      else: {expr: "floor((力量 + 体型 - 205) / 80) + 3"}
  移动力: {expr: "if(敏捷 > 体型 && 力量 > 体型, 9, if(敏捷 < 体型 && 力量 < 体型, 7, 8))"}
  生命值上限: {expr: "floor((体质 + 体型) / 10)"}
  生命值: {expr: "floor((体质 + 体型) / 10)"}
  魔法值上限: {expr: "floor(意志 / 5)"}
  魔法值: {expr: "floor(意志 / 5)"}
  理智上限: {expr: "99 - 克苏鲁神话"}
  母语: {copy_of: 教育}
  闪避: {half_of: 敏捷}
  灵感: {copy_of: 智力}
  知识: {copy_of: 教育}
# Deterministic creation/edit constraints (M16 stage B). `attributes` keys are
# the sheet's STORAGE keys (they clamp + roll straight into the attributes
# dict); budget formulas are condexpr over the CANONICAL value namespace.
creation_constraints:
  # Declaration order IS the creation roll order (seeded-dice reproducibility).
  attributes:
    STR: {min: 15, max: 90, roll: "3d6x5"}
    CON: {min: 15, max: 90, roll: "3d6x5"}
    SIZ: {min: 40, max: 90, roll: "(2d6+6)x5"}
    DEX: {min: 15, max: 90, roll: "3d6x5"}
    APP: {min: 15, max: 90, roll: "3d6x5"}
    INT: {min: 40, max: 90, roll: "(2d6+6)x5"}
    POW: {min: 15, max: 90, roll: "3d6x5"}
    EDU: {min: 40, max: 90, roll: "(2d6+6)x5"}
    LUC: {min: 15, max: 90, roll: "3d6x5"}
  skills:
    default: {min: 0, max: 90, growth_max: 99}
  budgets:
    # Skill-point budget: spent = sum over non-derived skills of the points
    # above the fresh-sheet base. The budget is the SUM of parts; a {max: [...]}
    # part takes the best of its alternatives (occupation formula families).
    skill_points:
      parts:
        - "智力 * 2"
        - max: ["教育 * 4", "教育 * 2 + 力量 * 2", "教育 * 2 + 敏捷 * 2", "教育 * 2 + 外貌 * 2", "教育 * 2 + 意志 * 2"]
# Initiative order roll: {name} slots read the sheet's canonical values.
initiative:
  roll: "1d100 + {敏捷}"
